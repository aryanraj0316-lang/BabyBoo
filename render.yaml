services:
  - type: web
    name: babyboo-prebook
    runtime: node
    plan: free
    buildCommand: npm ci --prefix prebooking && node --check prebooking/server.mjs
    startCommand: node prebooking/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
